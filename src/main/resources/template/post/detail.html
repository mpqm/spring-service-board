<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 상세</title>
    <style>

    </style>
</head>
<body>
<th:block th:insert="~{common/header :: HeaderFragment}"></th:block>
<div class="main-wrap">
    <div id="postContent" class="card text-bg-light bg-white d-flex w-100 mb-3 border border-dark p-3">
        <!-- 게시물 상세 정보 -->
        <div class="post-header">
            <div class="d-flex justify-content-between align-items-start flex-wrap">
                <div class="title-container">
                    <span id="categoryName" class="badge bg-dark text-white"></span>
                    <h2 id="postTitle" class="d-inline"></h2>
                </div>
                <div class="ms-auto mt-2">
                    <span id="createdAt"></span>
                </div>
            </div>
            <div class="d-flex justify-content-between mt-2">
                <div>
                    <span id="author"></span>
                </div>
                <div>
                    <i class="bi bi-eye-fill"></i> <span id="viewCount" class="me-3"> 0 </span>
                    <i class="bi bi-hand-thumbs-up-fill"></i> <span id="likeCount" class="me-3"> 0 </span>
                    <i class="bi bi-hand-thumbs-down-fill"></i> <span id="unlikeCount" class="me-3"> 0 </span>
                    <i class="bi bi-chat-left-dots-fill"></i> <span id="commentCount"> 0 </span>
                </div>
            </div>
        </div>

        <hr>

        <!-- 게시물 내용 -->
        <div class="post-content mt-3">
            <div id="content"></div>
        </div>

        <hr>

        <!-- 이미지 갤러리 -->
        <div id="imageGallery" class="mt-3">
            <!-- 이미지가 여기에 동적으로 추가됨 -->
        </div>

        <hr>

        <!-- 반응 버튼 -->
        <div class="d-flex justify-content-center my-3">
            <a th:href="@{/}" class="btn btn-outline-dark me-2">
                <i class="bi bi-list"></i> 목록
            </a>
            <button id="editButton" class="btn btn-outline-dark me-2">
                <i class="bi bi-pencil"></i> 수정
            </button>
            <button id="deleteButton" class="btn btn-outline-dark me-2">
                <i class="bi bi-trash"></i> 삭제
            </button>
            <button id="likeButton" class="btn btn-outline-dark me-2">
                <i class="bi bi-hand-thumbs-up"></i> 좋아요 <span>0</span>
            </button>
            <button id="unlikeButton" class="btn btn-outline-dark">
                <i class="bi bi-hand-thumbs-down"></i> 싫어요 <span>0</span>
            </button>
        </div>

        <hr>

        <!-- 댓글 섹션 -->
        <th:block th:insert="~{comment/list :: commentSection}"></th:block>
        
        <!-- 댓글 관련 모달 -->
        <th:block th:insert="~{comment/list :: replyModal}"></th:block>
        <th:block th:insert="~{comment/list :: editCommentModal}"></th:block>
    </div>

    <!-- 비밀번호 확인 모달 -->
    <div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="passwordModalLabel">보호된 게시글</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>이 게시글은 비밀번호로 보호되어 있습니다.</p>
                    <div class="mb-3">
                        <label for="postPassword" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="postPassword" placeholder="비밀번호를 입력하세요">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="passwordConfirmBtn">확인</button>
                </div>
            </div>
        </div>
    </div>
    
</div>
<th:block th:insert="~{common/footer :: FooterFragment}"></th:block>
<script th:src="@{/post/detail.js}"></script>
<script th:src="@{/comment/list.js}"></script>
</body>
</html>
