<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Summernote CSS -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
<th:block th:insert="~{common/header :: HeaderFragment}"></th:block>
<div class="main-wrap">
    <div class="card text-bg-light d-flex w-100 mb-3 border border-dark">
        <div class="card-header d-flex bg-white align-items-center justify-content-between">
            <span id="pageTitle">게시글 작성</span>
        </div>
        <div class="card-body bg-white">
            <form id="postCreateForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">게시글 설정</label>
                    <div class="d-flex">
                        <!-- 카테고리 드롭다운 -->
                        <div class="me-2 flex-grow-1">
                            <select id="categoryIdx" name="categoryIdx" class="form-select" required>
                                <option value="" selected disabled>카테고리 선택</option>
                                <option th:each="code : ${codes}"
                                        th:if="${code.groupName == 'POST_CATEGORY'}"
                                        th:value="${code.idx}"
                                        th:text="${code.codeName}"></option>
                            </select>
                        </div>
                        <!-- 공개범위 드롭다운 -->
                        <div class="flex-grow-1">
                            <select id="rangeIdx" name="rangeIdx" class="form-select" required>
                                <option value="" selected disabled>공개범위 선택</option>
                                <option th:each="code : ${codes}"
                                        th:if="${code.groupName == 'POST_RANGE'}"
                                        th:value="${code.idx}"
                                        th:text="${code.codeName}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">내용</label>
                    <div id="content" name="content"></div>
                </div>
                <div class="mb-3">
                    <label for="postImage" class="form-label">갤러리 이미지 업로드</label>
                    <input class="form-control bg-white" type="file" id="postImage" name="file" accept="image/*" multiple>
                    <div id="imagePreviewContainer" class="mt-2 d-flex flex-wrap gap-2"></div>
                </div>

                <!-- 게시글 수정 모드에서 기존 이미지 표시 -->
                <div id="existingImages" class="mb-3 d-flex flex-wrap gap-2"></div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-outline-dark w-100">저장</button>
                    <button type="button" id="cancelBtn" class="btn btn-outline-dark w-100">취소</button>
                </div>
            </form>
        </div>
    </div>
</div>
<th:block th:insert="~{common/footer :: FooterFragment}"></th:block>
<script th:src="@{../post/edit.js}"></script>
</body>
</html>
