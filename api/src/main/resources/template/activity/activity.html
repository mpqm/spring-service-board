<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 활동</title>
</head>
<body>
    <div th:replace="~{common/header :: HeaderFragment}"></div>
    <div class="main-wrap">
        <!-- 탭 메뉴 -->
        <div class="d-flex w-100 flex-wrap mb-3">
            <ul class="nav nav-tabs w-100" id="activityTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts" type="button" role="tab" aria-controls="posts" aria-selected="true">내가 쓴 게시물</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="comments-tab" data-bs-toggle="tab" data-bs-target="#comments" type="button" role="tab" aria-controls="comments" aria-selected="false">내가 쓴 댓글</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="likes-tab" data-bs-toggle="tab" data-bs-target="#likes" type="button" role="tab" aria-controls="likes" aria-selected="false">내가 누른 좋아요</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="unlikes-tab" data-bs-toggle="tab" data-bs-target="#unlikes" type="button" role="tab" aria-controls="unlikes" aria-selected="false">내가 누른 싫어요</button>
                </li>
            </ul>

        </div>

        <div class="d-flex w-100 flex-wrap">

            <!-- 탭 내용 -->
            <div class="tab-content w-100 " id="activityTabContent">
                <!-- 내가 쓴 게시물 탭 -->
                <div class="tab-pane fade show active w-100" id="posts" role="tabpanel" aria-labelledby="posts-tab">
                    <div class="d-flex w-100">
                        <table class="table table-hover border border-dark">
                            <thead class="bg-light rounded-top">
                            <tr class="text-center text-dark bg-white">
                                    <th scope="col" style="width: 5%">번호</th>
                                    <th scope="col" style="width: 10%">카테고리</th>
                                    <th scope="col" style="width: 10%">공개범위</th>
                                    <th scope="col" style="width: 40%" class="text-start">제목</th>
                                    <th scope="col" style="width: 3%"><i class="bi bi-eye-fill"></i></th>
                                    <th scope="col" style="width: 3%"><i class="bi bi-hand-thumbs-up-fill"></i></th>
                                    <th scope="col" style="width: 3%"><i class="bi bi-hand-thumbs-down-fill"></i></th>
                                    <th scope="col" style="width: 3%"><i class="bi bi-chat-left-dots-fill"></i></th>
                                    <th scope="col" style="width: 15%">작성일</th>
                                </tr>
                            </thead>
                            <tbody id="postsTableBody">
                                <!-- JavaScript로 동적 생성 -->
                            </tbody>
                        </table>
                    </div>
                    <div id="postsPagination" class="d-flex justify-content-center">
                        <!-- 페이지네이션 -->
                    </div>
                    <div id="noPostsMessage" class="text-center d-none">
                        <p class="my-3">작성한 게시물이 없습니다.</p>
                    </div>
                </div>

                <!-- 내가 쓴 댓글 탭 -->
                <div class="tab-pane fade w-100" id="comments" role="tabpanel" aria-labelledby="comments-tab">
                    <div class="d-flex w-100">
                        <table class="table table-hover border border-dark">
                            <thead class="bg-light rounded-top">
                            <tr class="text-center text-dark bg-white">
                                    <th scope="col" style="width: 5%">번호</th>
                                    <th scope="col" style="width: 10%">게시글</th>
                                    <th scope="col" style="width: 50%" class="text-start">내용</th>
                                    <th scope="col" style="width: 3%"><i class="bi bi-hand-thumbs-up-fill"></i></th>
                                    <th scope="col" style="width: 3%"><i class="bi bi-hand-thumbs-down-fill"></i></th>
                                    <th scope="col" style="width: 15%">작성일</th>
                                </tr>
                            </thead>
                            <tbody id="commentsTableBody">
                                <!-- JavaScript로 동적 생성 -->
                            </tbody>
                        </table>
                    </div>
                    <div id="commentsPagination" class="d-flex justify-content-center">
                        <!-- 페이지네이션 -->
                    </div>
                    <div id="noCommentsMessage" class="text-center d-none">
                        <p class="my-3">작성한 댓글이 없습니다.</p>
                    </div>
                </div>

                <!-- 좋아요 탭 -->
                <div class="tab-pane fade w-100" id="likes" role="tabpanel" aria-labelledby="likes-tab">
                    <div class="d-flex w-100">
                        <table class="table table-hover border border-dark">
                            <thead class="bg-light rounded-top">
                            <tr class="text-center text-dark bg-white">
                                    <th scope="col" style="width: 5%">번호</th>
                                    <th scope="col" style="width: 10%">카테고리</th>
                                    <th scope="col" style="width: 60%" class="text-start">내용</th>
                                    <th scope="col" style="width: 15%">작성일</th>
                                    <th scope="col" style="width: 10%">취소</th>
                                </tr>
                            </thead>
                            <tbody id="likesTableBody">
                                <!-- JavaScript로 동적 생성 -->
                            </tbody>
                        </table>
                    </div>
                    <div id="likesPagination" class="d-flex justify-content-center">
                        <!-- 페이지네이션 -->
                    </div>
                    <div id="noLikesMessage" class="text-center d-none">
                        <p class="my-3">좋아요한 항목이 없습니다.</p>
                    </div>
                </div>

                <!-- 싫어요 탭 -->
                <div class="tab-pane fade w-100" id="unlikes" role="tabpanel" aria-labelledby="unlikes-tab">
                    <div class="d-flex w-100">
                        <table class="table table-hover border border-dark">
                            <thead class="bg-light rounded-top">
                            <tr class="text-center text-dark bg-white">
                                    <th scope="col" style="width: 5%">번호</th>
                                    <th scope="col" style="width: 10%">카테고리</th>
                                    <th scope="col" style="width: 60%" class="text-start">내용</th>
                                    <th scope="col" style="width: 15%">작성일</th>
                                    <th scope="col" style="width: 10%">취소</th>
                                </tr>
                            </thead>
                            <tbody id="unlikesTableBody">
                                <!-- JavaScript로 동적 생성 -->
                            </tbody>
                        </table>
                    </div>
                    <div id="unlikesPagination" class="d-flex justify-content-center">
                        <!-- 페이지네이션 -->
                    </div>
                    <div id="noUnlikesMessage" class="text-center d-none">
                        <p class="my-3">싫어요한 항목이 없습니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 댓글 수정 모달 -->
    <div class="modal fade" id="editCommentModal" tabindex="-1" aria-labelledby="editCommentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCommentModalLabel">댓글 수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editCommentIdx">
                    <div class="mb-3">
                        <label for="editCommentContent" class="form-label">댓글 내용</label>
                        <textarea class="form-control" id="editCommentContent" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="saveCommentBtn">저장</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:insert="~{common/footer :: FooterFragment}"></th:block>
    <script th:src="@{/activity/activity.js}"></script>
</body>
</html>
