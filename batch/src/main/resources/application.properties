# default
spring.application.name=board-batch
spring.config.import=optional:file:batch/src/main/resources/.env[.properties]
server.port=9091

# dataSource
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# mybatis
mybatis.mapper-locations=classpath*:/mapper/**/*.xml
mybatis.configuration.jdbc-type-for-null=null
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.board
logging.level.com.board.batch=DEBUG
logging.level.com.board.common=DEBUG

# Spring Batch Configuration
spring.main.allow-bean-definition-overriding=true
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
